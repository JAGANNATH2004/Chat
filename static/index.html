<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simple Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Simple Chat</h2>
      <div class="header-right">
        <button type="button" id="clearBtn" class="clear-btn" onclick="clearChat()">Clear</button>
        <span id="status" class="status">Connecting...</span>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <form id="chatForm" class="input-container">
      <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" autofocus>
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
